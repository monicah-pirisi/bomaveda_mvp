expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
file_uploads = On
upload_max_filesize = 50M
post_max_size = 55M
allow_url_fopen = Off
allow_url_include = Off
session.use_cookies = 1
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,show_source,parse_ini_file
