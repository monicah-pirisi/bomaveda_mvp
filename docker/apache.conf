ErrorLogFormat "[%l] %M"
ServerTokens Prod
ServerSignature Off
TraceEnable Off
AddType application/manifest+json .webmanifest
<Directory /var/www/html/public>
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /index.php
</Directory>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
